name: Data update

# 每天 05:17 UTC（14:17 JST）补一次增量：这个时间点前一天的直播基本都结束，
# 回放 / 弹幕 / VSTATS 也已经开放；避开整点可以减少 GitHub 调度延迟。
on:
  schedule:
    # GitHub 的 schedule 只是「理想时间」：高负载会排队，实测晚了 5–6 小时。
    # 2026-10-31 的 05:17Z 那次 10:55Z 才真正开始，11-01 的 05:17Z 这次是 11:50Z，
    # 对应北京时间 19 点左右。想要卡准 14:17 JST 得靠外部调度器打 workflow_dispatch。
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 重抓最近 24 小时的场次
        type: boolean
        default: false
      dataset:
        description: 只更新指定成员（留空 = 全部）
        type: string
        required: false

permissions:
  contents: read
  issues: write
  actions: read
  checks: read

# 定时与手动可能撞车；不取消正在跑的那次，排队即可。
concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SITE_URL: ${{ vars.SITE_URL }}
      PURGE_TOKEN: ${{ secrets.PURGE_TOKEN }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PREFIX: ${{ secrets.R2_PREFIX }}
      # 有订阅就走 mihomo 代理；没配就直连（runner 的云厂商 IP 更容易被 bot 检查）。
      MIHOMO_VERSION: v1.19.30
      MIHOMO_SUB_URL: ${{ secrets.MIHOMO_SUB_URL }}
      # 出口地区要跟 YT_COOKIES 的签发地区一致，否则日本 cookie 配香港出口会直接撞
      # "Sign in to confirm you're not a bot"。日本优先，没有日本节点时退香港。
      MIHOMO_REGION: 日本,香港
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 安静日不会生成任何文件；先建目录，缓存保存步骤才有合法路径。
      - name: Prepare data directory
        run: mkdir -p data

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # ingest / 探针现在直接用 drizzle-orm 与 @neondatabase/serverless；
      # 旧脚本只依赖本地文件，以前不需要装包。
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # yt-dlp 解 YouTube 的 JS challenge 需要一个 JS runtime；deno 与本地保持一致。
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install yt-dlp
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux -o "$RUNNER_TEMP/bin/yt-dlp"
          chmod +x "$RUNNER_TEMP/bin/yt-dlp"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/yt-dlp" --version

      # 云厂商 IP 上光有 cookie 不够：YouTube 还要 PO Token，否则每个 watch 页都会
      # 回 "Sign in to confirm you're not a bot"。插件装进 yt-dlp 插件目录，
      # 令牌由本地 4416 端口的容器现场生成；起不来就告警降级成纯 cookie。
      - name: Install PO token provider
        run: |
          set -uo pipefail
          mkdir -p "$HOME/.config/yt-dlp/plugins/bgutil-ytdlp-pot-provider"
          curl -fsSL -o /tmp/bgutil.zip \
            "https://github.com/Brainicism/bgutil-ytdlp-pot-provider/releases/latest/download/bgutil-ytdlp-pot-provider.zip"
          unzip -q -o /tmp/bgutil.zip -d "$HOME/.config/yt-dlp/plugins/bgutil-ytdlp-pot-provider"
          if docker run --name bgutil-provider -d --init \
            -p 127.0.0.1:4416:4416 brainicism/bgutil-ytdlp-pot-provider; then
            for _ in $(seq 1 30); do
              if curl -sf http://127.0.0.1:4416/ping > /dev/null; then
                echo "PO token provider ready"
                exit 0
              fi
              sleep 1
            done
            docker logs bgutil-provider 2>&1 | tail -n 20 || true
          fi
          echo "::warning::PO token provider 没起来，本次只靠 cookie（更容易被 bot 检查拦）"

      # 代理是可选兜底：配了 MIHOMO_SUB_URL 才走，起不来就告警并直连。
      - name: Cache mihomo
        if: env.MIHOMO_SUB_URL != ''
        uses: actions/cache@v6
        with:
          path: ~/mihomo
          key: mihomo-${{ runner.os }}-${{ env.MIHOMO_VERSION }}

      - name: Prepare mihomo config
        id: mihomo
        if: env.MIHOMO_SUB_URL != ''
        run: |
          set -euo pipefail
          mkdir -p /tmp/mihomo
          # 订阅端是自签证书，只能跳过校验。
          if ! curl -fsSL --retry 3 --retry-all-errors -k -A 'clash.meta' \
            "$MIHOMO_SUB_URL" -o /tmp/mihomo/subscription.yaml; then
            echo "::warning::MIHOMO_SUB_URL 拉取失败，本次直连"
            exit 0
          fi
          if ! bun scripts/mihomo-config.ts /tmp/mihomo/subscription.yaml /tmp/mihomo/config.yaml; then
            echo "::warning::订阅里没有可用节点，本次直连"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Start mihomo
        if: steps.mihomo.outputs.ready == 'true'
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/mihomo/core" ]; then
            curl -fsSL -o /tmp/core.gz \
              "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-amd64-${MIHOMO_VERSION}.gz"
            gunzip -f /tmp/core.gz
            mkdir -p "$HOME/mihomo"
            mv /tmp/core "$HOME/mihomo/core"
            chmod +x "$HOME/mihomo/core"
          fi
          nohup "$HOME/mihomo/core" -d /tmp/mihomo -f /tmp/mihomo/config.yaml > /tmp/mihomo/core.log 2>&1 &
          ready=0
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9099/version > /dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "::warning::mihomo 没有起来，本次直连（更容易被 YouTube bot 检查拦）"
            tail -n 50 /tmp/mihomo/core.log || true
            exit 0
          fi
          PROXY_NODE=$(cat /tmp/mihomo/config.yaml.proxy-node)
          curl -sf -X PUT -H 'Content-Type: application/json' \
            -d "{\"name\":\"${PROXY_NODE}\"}" http://127.0.0.1:9099/proxies/PICK
          echo "YTDLP_PROXY=http://127.0.0.1:7890" >> "$GITHUB_ENV"
          echo "mihomo ready, egress via ${PROXY_NODE}"

      - name: Check configuration
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Set the DATABASE_URL repository secret (Worker read path + ingest)."
            exit 1
          fi
          if [ -z "$R2_BUCKET" ] || [ -z "$R2_ACCOUNT_ID" ]; then
            echo "::error::Set the R2_* repository secrets before running the data job."
            exit 1
          fi
          if [ -z "$SITE_URL" ] || [ -z "$PURGE_TOKEN" ]; then
            echo "::warning::SITE_URL / PURGE_TOKEN 未配置，本次不会失效 Workers Cache；页面会在 TTL 后自然过期。"
          fi

      # 本地暂存区跨运行保留：已有 150 MB 左右的 pack，不清空就不会每天重下。
      - name: Restore data cache
        uses: actions/cache/restore@v6
        with:
          path: data
          key: data-${{ github.run_id }}
          restore-keys: |
            data-

      - name: Write cookies
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -z "$YT_COOKIES" ]; then
            echo "::error::Missing YT_COOKIES secret. Run: bun scripts/export-yt-cookies.ts --push"
            exit 1
          fi
          printf '%s\n' "$YT_COOKIES" > "$RUNNER_TEMP/cookies.txt"
          chmod 600 "$RUNNER_TEMP/cookies.txt"

      # cookie 过期 / PO token 缺失时，每个 watch 页都会被 bot 检查拦，
      # 而 fetch-streams 以前把元信息失败只记进进度文件。先探一场已知可读的场次，
      # 让失败停在日志清楚的地方，而不是跑完 7 分钟再报「成功」。
      # 探针不能写死视频 ID：yt-dlp 的测试视频 BaW_jenozKc 下架之后，这步会把
      # 「视频没了」误报成 cookie / 代理故障。优先取数据库里最近的一场真实场次。
      - name: Check YouTube access
        run: |
          set -uo pipefail
          echo "egress: $(curl -s --max-time 15 https://www.cloudflare.com/cdn-cgi/trace | grep -E '^(ip|loc)=' | tr '\n' ' ')"
          common=(--cookies "$RUNNER_TEMP/cookies.txt" --socket-timeout 30 --retries 2)
          if [ -n "${YTDLP_PROXY:-}" ]; then
            common+=(--proxy "$YTDLP_PROXY")
          fi
          probe=$(bun scripts/db-latest-video.ts 2>/dev/null || true)
          if [ -z "$probe" ]; then
            channel=$(jq -r '.datasets[0].channelId' data-sources.json)
            probe=$(yt-dlp --flat-playlist --playlist-items 1 --print '%(id)s' "${common[@]}" \
              "https://www.youtube.com/channel/${channel}/streams" 2> /dev/null | head -n 1)
          fi
          if [ -z "$probe" ]; then
            echo "::error::拿不到探针视频：数据库为空，频道 /streams 也读不出来。先查 DATABASE_URL、YT_COOKIES 与代理。"
            exit 1
          fi
          echo "probe: https://www.youtube.com/watch?v=${probe}"
          if yt-dlp -v --simulate -J "${common[@]}" "https://www.youtube.com/watch?v=${probe}" > /dev/null 2> /tmp/probe.log; then
            grep -E '\[pot\]|Generating a .* PO Token|cookies are no longer valid' /tmp/probe.log | sort -u || true
            echo "yt-dlp 可以读取元信息"
            exit 0
          fi
          tail -n 30 /tmp/probe.log
          echo "::error::yt-dlp 读不到元信息。按这个顺序查：YT_COOKIES 是否还有效（日志里找 cookies are no longer valid）、PO token 容器是否起来、出口 IP 是否被拦。"
          exit 1

      - name: Update data
        run: |
          args=(--root "$RUNNER_TEMP/youtube-live" --cookies "$RUNNER_TEMP/cookies.txt" --concurrency 2)
          if [ "${{ inputs.force }}" = "true" ]; then
            args+=(--force)
          fi
          if [ -n "${{ inputs.dataset }}" ]; then
            args+=(--dataset "${{ inputs.dataset }}")
          fi
          bun scripts/daily-update.ts "${args[@]}"

      - name: Remove cookies
        if: always()
        run: rm -f "$RUNNER_TEMP/cookies.txt"

      - name: Dump proxy logs
        if: failure() || cancelled()
        run: |
          tail -n 100 /tmp/mihomo/core.log || true
          docker logs bgutil-provider 2>&1 | tail -n 100 || true

      # cron 健康通知：失败时开 issue，避免静默断更。
      # annotation 没有环境变量，只能按本次运行的 check run 反查；写进正文省得每次翻日志。
      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          collect_annotations() {
            for check_url in $(gh api "repos/${REPO}/actions/runs/${RUN_ID}/jobs" --jq '.jobs[].check_run_url' 2>/dev/null || true); do
              gh api "${check_url}/annotations" \
                --jq '.[] | select(.annotation_level != "notice") | "- [\(.annotation_level)] `\(.path):\(.start_line)` \(.message)"' \
                2>/dev/null || true
            done
          }
          annotations=$(collect_annotations | sort -u)
          if [ -z "$annotations" ]; then
            sleep 2
            annotations=$(collect_annotations | sort -u)
          fi
          if [ -z "$annotations" ]; then
            annotations="- （本次没有 failure / warning annotation，失败步骤的日志请看运行页面）"
          fi
          {
            echo "定时数据更新失败：${RUN_URL}"
            echo
            echo "## Annotations"
            printf '%s\n' "$annotations"
            echo
            echo "检查顺序：Check YouTube access 那步的日志（cookie / PO token / 出口 IP）、MIHOMO_SUB_URL / mihomo 是否可用、YT_COOKIES 是否过期、DATABASE_URL 与 R2_* 凭据。"
          } > /tmp/issue-body.md
          gh issue create \
            --title "Data update failed" \
            --assignee Chilfish \
            --repo "${REPO}" \
            --body-file /tmp/issue-body.md

      - name: Stop proxies
        if: always()
        run: |
          pkill -f "$HOME/mihomo/core" || true
          docker rm -f bgutil-provider > /dev/null 2>&1 || true

      - name: Save data cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: data
          key: data-${{ github.run_id }}
