name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      VITE_DATAPACK_BASE: ${{ vars.VITE_DATAPACK_BASE }}
      VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install
        run: bun install --frozen-lockfile

      - name: Check datapack base
        run: |
          if [ -z "$VITE_DATAPACK_BASE" ]; then
            echo "::error::Set the repository variable VITE_DATAPACK_BASE to the public object storage root."
            exit 1
          fi

      - name: Check site url
        run: |
          if [ -z "$VITE_SITE_URL" ]; then
            echo "::error::Set the repository variable VITE_SITE_URL to the production origin (used for canonical / OG / sitemap)."
            exit 1
          fi

      - name: Verify
        run: bun run ci

      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          if-no-files-found: error
